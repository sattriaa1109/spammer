services:
  db:
    image: postgres:15-alpine
    container_name: fb_bot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fb_bot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fb_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fb_bot_api
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/fb_bot_db
      - HEADLESS=true
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
